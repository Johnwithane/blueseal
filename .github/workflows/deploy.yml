name: Deploy to Firebase (production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: firebase-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Firebase web config is PUBLIC by design: it ships in every browser
      # bundle and is guarded by Firestore rules + App Check, not by secrecy.
      # Inlined here (NOT GitHub secrets) so an empty/missing secret can never
      # again produce a config-less bundle — that was the auth/invalid-api-key
      # production outage on 2026-06-12. These mirror .env "Firebase (production)".
      #
      # ⚠ DO NOT move these back to GitHub secrets to silence a scanner.
      # Secret scanners (GitGuardian etc.) flag these AIzaSy* keys, but that is an
      # EXPECTED false positive — they are public client keys, verified locked down
      # on 2026-06-12: the Maps key is referrer+API-restricted to our domains; the
      # Firebase key is API-restricted to Firebase services. Resolve the alert as a
      # false positive; reverting to secrets just reintroduces the empty-secret outage.
      VITE_FIREBASE_API_KEY: AIzaSyBAH4g0acwSAvOO7SFE8j5U4q3RptyjUV8
      VITE_FIREBASE_AUTH_DOMAIN: blueseal-762af.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: blueseal-762af
      VITE_FIREBASE_STORAGE_BUCKET: blueseal-762af.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "281998435067"
      VITE_FIREBASE_APP_ID: "1:281998435067:web:3bcae4b11de7937368465e"
      VITE_FIREBASE_MEASUREMENT_ID: G-5G9KY529JN
      # Web Push + Maps + Stripe publishable keys are all public (browser-side),
      # referrer/origin-restricted at the provider. Inlined for the same reason.
      VITE_FIREBASE_VAPID_KEY: BFOW11nkcu50B2pVe6ehZaGem_MxBWV2TpQAzFl6So4NsTeYLHkx6YS9T0mUuwm548awPAT8PW9iYwKo9aXAnig
      VITE_GOOGLE_MAPS_API_KEY: AIzaSyDVA_zBuNFC-iRyq8K8fBFuHAFwq6cuDp4
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51ThLy6EfjKnllaHjUHtX6lz0qDzM5cIEDpwoiY277vEyHV3TxZiKfNFdVp0E4HUCZIJ698ThlR4QMnZUZor1Rfbh00QWxGXQPb
      # Unsplash Access Key — read-only PUBLIC API (Search/Download only); ships in
      # the bundle like the keys above. Powers the profile banner/portfolio image
      # picker; the picker hides itself if this is unset. Never the Secret Key.
      VITE_UNSPLASH_ACCESS_KEY: rMSRcTXVfC4QL5ulBytN3FFN6S7Xft8GYNNy9wSVa7w
      # SENTRY_DSN stays optional (empty today) — harmless if unset.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_APP_URL: https://blueseal.app
      VITE_APP_NAME: Blue Seal
      VITE_DEFAULT_CURRENCY: CAD
      VITE_DEFAULT_REGION: CA
      VITE_USE_EMULATORS: "false"

    steps:
      # fetch-depth: 0 — the "Resolve changed functions" step diffs this push
      # against github.event.before, which isn't in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detect what actually changed in this push so we only deploy the affected
      # targets. Frontend-only pushes (the common case) skip the Cloud Functions
      # deploy entirely. Deploying all ~180 functions on every push trips the
      # per-minute Functions mutation quota and fails the whole release.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            functions:
              - 'functions/**'
              - 'firebase.json'
            rules:
              - 'firestore.rules'
              - 'storage.rules'
              - 'firestore.indexes.json'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install app deps
        run: npm ci

      - name: Install functions deps
        if: steps.changes.outputs.functions == 'true'
        run: npm ci
        working-directory: functions

      - name: Build app (type-check + bundle)
        run: npm run build

      - name: Build functions
        if: steps.changes.outputs.functions == 'true'
        run: npm run build
        working-directory: functions

      - name: Auth to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: blueseal-762af

      - name: Deploy Firestore rules + indexes + Storage rules
        if: steps.changes.outputs.rules == 'true'
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project blueseal-762af --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      # Deploy ONLY the functions whose source actually changed in this push.
      # `--only functions` (all ~190) reliably trips the per-minute Functions
      # mutation quota and fails the step — which used to take Hosting down with
      # it, so a frontend fix couldn't ship because an unrelated function was
      # rate-limited. Twice: runs 28974629400 and 31628627790.
      #
      # We map changed files under functions/src/**/<name>.ts to their exported
      # function name (file basename == export name, the convention across
      # functions/src/index.ts). Anything shared (lib/, index.ts, package.json,
      # tsconfig) can affect every function, so that falls back to a full deploy.
      - name: Resolve changed functions
        if: steps.changes.outputs.functions == 'true'
        id: fns
        run: |
          BASE='${{ github.event.before }}'
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref — full deploy"
            echo "targets=functions" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" '${{ github.sha }}' -- functions/ firebase.json)
          echo "changed files:"; echo "$CHANGED"
          NAMES=""
          for f in $CHANGED; do
            case "$f" in
              firebase.json|functions/package.json|functions/package-lock.json|functions/tsconfig.json|functions/src/index.ts|functions/src/lib/*)
                echo "shared: $f — full deploy"
                echo "targets=functions" >> "$GITHUB_OUTPUT"; exit 0;;
              *.test.ts) continue;;
              *.ts) ;;
              *) continue;;
            esac
            # functions/src/jobs/foo.ts -> the names index.ts re-exports from
            # "./jobs/foo". Resolving through index.ts (rather than assuming the
            # basename IS the export) means a shared helper with no export entry
            # — inviteHelpers, stripeClient, prospects/helpers, ~24 of them —
            # correctly widens to a full deploy instead of emitting a target
            # name that doesn't exist and failing the whole step.
            REL=$(printf '%s' "$f" | sed -E 's#^functions/src/(.*)\.ts$#\1#')
            FOUND=$(grep -oE "export \{[^}]+\} from \"\./${REL}\"" functions/src/index.ts \
              | sed -E 's/export \{([^}]*)\}.*/\1/' | tr ',' '\n' | tr -d ' ')
            if [ -z "$FOUND" ]; then
              echo "no index.ts export maps to $f — full deploy"
              echo "targets=functions" >> "$GITHUB_OUTPUT"; exit 0
            fi
            NAMES="$NAMES $FOUND"
          done
          NAMES=$(printf '%s' "$NAMES" | tr ' ' '\n' | grep -v '^$' | sort -u)
          if [ -z "$NAMES" ]; then
            echo "no function sources changed — skipping the functions deploy"
            echo "targets=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TARGETS=$(echo "$NAMES" | sed 's/^/functions:/' | paste -sd, -)
          echo "targeted deploy: $TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      # continue-on-error so a rate-limited function can't skip Hosting below.
      # The run is still failed explicitly by the gate at the end.
      - name: Deploy Cloud Functions
        id: deploy_functions
        if: steps.changes.outputs.functions == 'true' && steps.fns.outputs.targets != ''
        continue-on-error: true
        run: npx firebase-tools deploy --only '${{ steps.fns.outputs.targets }}' --project blueseal-762af --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      # Always runs, even if the functions deploy above failed. Hosting is the
      # user-facing release; holding it hostage to a rate-limited (and often
      # already-deployed) function is what caused the two stuck releases. A
      # failed functions step still fails the job overall — see the gate below.
      - name: Deploy Hosting
        if: always() && steps.auth.outcome == 'success'
        run: npx firebase-tools deploy --only hosting --project blueseal-762af --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      # Surface a functions failure as a red run (so it isn't silently ignored)
      # without having blocked the hosting release above.
      - name: Fail the run if the functions deploy failed
        if: always() && steps.deploy_functions.outcome == 'failure'
        run: |
          echo "::error::Cloud Functions deploy failed. Hosting still shipped; re-run or deploy the affected functions manually."
          exit 1
