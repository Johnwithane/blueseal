name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint + build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder values so vite build succeeds without exposing real secrets.
      # Real values are only injected by deploy.yml on push to main.
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
      VITE_FIREBASE_APP_ID: ci-placeholder
      VITE_FIREBASE_MEASUREMENT_ID: ci-placeholder
      VITE_GOOGLE_MAPS_API_KEY: ci-placeholder
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      VITE_SENTRY_DSN: ""
      VITE_APP_URL: https://blueseal.app
      VITE_APP_NAME: Blue Seal
      VITE_DEFAULT_CURRENCY: CAD
      VITE_DEFAULT_REGION: CA
      VITE_USE_EMULATORS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install app deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check + bundle)
        run: npm run build

      - name: Unit tests
        run: npm run test:run

  functions:
    name: Functions (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Build functions (tsc)
        run: npm run build
        working-directory: functions
