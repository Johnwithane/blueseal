<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/faviconBS.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/faviconBS-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/faviconBS-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d406a" />
    <!-- seo:start — default social-share tags. Per-route values are set at
         runtime by @unhead (useSeo) and replaced in prerendered pages by
         scripts/prerender.ts (which swaps everything between these markers).
         This block is the fallback for the app shell + non-prerendered routes. -->
    <meta
      name="description"
      content="Blue Seal connects Canadian homeowners with verified tradespeople — every pro checked for government ID, trade certification, insurance and WSIB. Search, quote, schedule, pay and review, all in one trusted job thread."
    />
    <link rel="canonical" href="https://blueseal.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blue Seal" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:title" content="Blue Seal — Verified Canadian tradespeople" />
    <meta
      property="og:description"
      content="Verified tradespeople across Canada — ID, certification, insurance and WSIB checked. Search, quote, schedule, pay and review in one trusted job thread."
    />
    <meta property="og:url" content="https://blueseal.app/" />
    <meta property="og:image" content="https://blueseal.app/icons/blueseal_logo_LARGE.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blue Seal — Verified Canadian tradespeople" />
    <meta
      name="twitter:description"
      content="Verified tradespeople across Canada — ID, certification, insurance and WSIB checked. Search, quote, schedule, pay and review in one trusted job thread."
    />
    <meta name="twitter:image" content="https://blueseal.app/icons/blueseal_logo_LARGE.png" />
    <!-- seo:end -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Poltawski+Nowy:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/icons/blueseal_logoCircle.png" />
    <!-- Boot splash. Covers the prerendered, crawler-only markup baked into
         #app (see scripts/prerender.ts) while the SPA bundle downloads and
         auth initialises, so real browsers never see the unstyled SEO shell.
         Inline + self-contained so it paints on first render, independent of
         the app bundle; removed by main.ts the moment Vue mounts. -->
    <style>
      #bs-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fb;
        transition: opacity 250ms ease;
      }
      #bs-splash.bs-splash--out {
        opacity: 0;
        pointer-events: none;
      }
      #bs-splash img {
        width: min(55vw, 240px);
        height: auto;
        object-fit: contain;
        animation: bs-splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes bs-splash-pulse {
        0%,
        100% {
          transform: scale(0.92);
        }
        50% {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #bs-splash,
        #bs-splash img {
          animation: none;
          transition: none;
        }
      }
    </style>
    <!-- With JS disabled the SPA never mounts, so hide the splash and let the
         baked crawler markup show through as a static fallback. -->
    <noscript>
      <style>
        #bs-splash {
          display: none;
        }
      </style>
    </noscript>
    <title>Blue Seal</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="bs-splash" aria-hidden="true">
      <img src="/icons/blueseal_logoCircle.png" alt="" width="240" height="240" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
